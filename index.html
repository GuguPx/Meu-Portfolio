<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Anti-flash de tema: aplica claro/escuro ANTES do primeiro paint
         (mesma lógica do ThemeContext: preferência salva > sistema > escuro). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t ? t === "dark" : !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <!-- ===== SEO básico =====
         URL pública do site (deve corresponder ao deploy):
         usada em og:url/twitter, canonical, JSON-LD, robots.txt e sitemap.xml -->
    <!-- Title ≤60 chars e description ≤150 chars (evita truncamento no Google) -->
    <title>Augusto Silva | Desenvolvedor Full Stack · React & Node.js</title>
    <meta name="description" content="Desenvolvedor Full Stack: sistemas internos, automações, integrações e dashboards para operação de provedor de internet. React, TypeScript e Node.js." />
    <meta name="author" content="Augusto Silva" />
    <meta name="keywords" content="Augusto Silva, desenvolvedor full stack, frontend, backend, React, TypeScript, Node.js, APIs REST, automação, sistemas internos, portfólio, CRM, IXC Soft, bots, ETL, Google Sheets, assinatura digital, integrações" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#081316" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://portfolioaugusto.vercel.app/" />

    <!-- ===== Open Graph ===== -->

    <meta property="og:image:height" content="630" />

    <!-- ===== Twitter ===== -->
